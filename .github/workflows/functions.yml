name: Deploy Cloud Functions
# פריסה אוטומטית של ה-Cloud Functions בכל שינוי בתיקיית functions (גם ידנית: Run workflow).
# פורס פונקציות בלבד — לא נוגע ב-Firestore Rules, בנתונים או באתר.
# נדרשים Secrets בריפו: FIREBASE_SERVICE_ACCOUNT, GEMINI_API_KEY

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - ".github/workflows/functions.yml"
  workflow_dispatch:

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

env:
  PROJECT: cranes-a0759
  REGION: europe-west1

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - name: Install
        run: |
          npm ci --prefix functions
          npm install -g firebase-tools

      - name: Check secrets
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GK: ${{ secrets.GEMINI_API_KEY }}
        run: |
          [ -n "$SA" ] || { echo "::error::Missing repo secret FIREBASE_SERVICE_ACCOUNT"; exit 1; }
          [ -n "$GK" ] || { echo "::error::Missing repo secret GEMINI_API_KEY"; exit 1; }

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

      - name: Sync GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -uo pipefail
          report() { echo "::error title=$1::$(tail -20 "$2" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; }
          # Secret Manager חייב להיות פעיל בפרויקט כדי לשמור את המפתח
          gcloud services enable secretmanager.googleapis.com cloudfunctions.googleapis.com cloudbuild.googleapis.com \
            artifactregistry.googleapis.com run.googleapis.com eventarc.googleapis.com --project "$PROJECT" > enable.log 2>&1 \
            || { report "enable APIs failed" enable.log; exit 1; }
          value="$(printf '%s' "$GEMINI_API_KEY" | tr -d '[:space:]')"
          current="$(firebase functions:secrets:access GEMINI_API_KEY --project "$PROJECT" 2>/dev/null || true)"
          if [ "$current" != "$value" ]; then state=updated; else state=unchanged; fi
          echo "::warning title=GEMINI key::key ending ...${value: -4} ($state)"
          if [ "$current" != "$value" ]; then
            echo "Updating GEMINI_API_KEY"
            printf '%s' "$value" | firebase functions:secrets:set GEMINI_API_KEY --data-file=- --project "$PROJECT" --non-interactive --force > secret.log 2>&1 \
              || { report "secret set failed" secret.log; [ -f firebase-debug.log ] && report "firebase debug" firebase-debug.log; exit 1; }
          else
            echo "GEMINI_API_KEY unchanged"
          fi
          # פריסה מחדש כשהסוד מתעדכן (פונקציה ננעלת על גרסת הסוד בזמן הפריסה)
          gcloud secrets versions list GEMINI_API_KEY --project "$PROJECT" --filter='state=ENABLED' --sort-by='~createTime' --limit=1 --format='value(name)' > functions/.secret-version

      - name: Deploy
        run: |
          set +e
          firebase deploy --only functions --project "$PROJECT" --non-interactive --force 2>&1 | tee deploy.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            msg="$( (grep -iE 'error|denied|permission|failed|required|enable' deploy.log; [ -f firebase-debug.log ] && grep -iE '"message"|error:' firebase-debug.log) | grep -v '^\s*$' | tail -25 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
            echo "::error title=firebase deploy failed::${msg}"
          fi
          exit $status

      # הפונקציה בודקת בעצמה שהמשתמש מחובר, לכן היא חייבת להיות נגישה לקריאה מהדפדפן
      - name: Ensure public invoker
        run: |
          gcloud run services add-iam-policy-binding scancertificate --region "$REGION" --project "$PROJECT" \
            --member=allUsers --role=roles/run.invoker --quiet --format=none
          echo "ok scancertificate"
